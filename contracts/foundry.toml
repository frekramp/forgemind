[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
# Conservative target for the LiteForge (Arbitrum Orbit / Caldera) rollup — avoids
# newer opcodes (PUSH0 / transient storage) that a young testnet may not support.
evm_version = "paris"

[rpc_endpoints]
liteforge = "${LITEFORGE_RPC_URL}"

[etherscan]
liteforge = { key = "${BLOCKSCOUT_API_KEY}", url = "https://liteforge.explorer.caldera.xyz/api", chain = 4441 }

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/config.md
